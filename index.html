    <div id="taskContainer">
        <h class="add">Add New Task</h3>
        <div class="task">
    <input type="text" id="title" placeholder="Type task.">
    <select name="priority" id="priority" required>

        <option value="Medium">Medium</option>

<button class="filterBtn" data-filter="High">High</button>
<button class="filterBtn" data-filter="Medium">Medium</button>
<button class="filterBtn" data-filter="Low">Low</button>
